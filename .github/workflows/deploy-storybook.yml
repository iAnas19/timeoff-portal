name: Deploy Storybook

# Publishes the static Storybook (the UI-state matrix) to GitHub Pages on push.
# The Next.js app itself is deployed separately to Vercel; this is just the
# zero-cost, zero-token home for the static Storybook build.
#
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".
# It then serves at: https://<owner>.github.io/<repo>/

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel an in-progress deploy halfway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static
      - id: deployment
        uses: actions/deploy-pages@v4
